version: '3.7'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_BROKER_ID: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  streamer:
    build: ./streamer  # TODO: Dockerfile for Flask in ./streamer directory
    ports:
      - "5000:5000"
    depends_on:
      - kafka

  spark:
    build: ./spark/job  # TODO: Dockerfile for Spark in ./spark/job directory
    depends_on:
      - kafka
